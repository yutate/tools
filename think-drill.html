<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Think Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0a07;
    --bg2: #150f09;
    --surface: #1c1409;
    --surface2: #221a0e;
    --border: rgba(255,180,80,0.08);
    --accent: #f5a623;
    --accent2: #e8602c;
    --accent3: #c47d1a;
    --text: #f0e6d3;
    --text2: #a08060;
    --text3: #5a4030;
    --expand-color: #f5a623;
    --narrow-color: #e8602c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(245,166,35,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,166,35,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 2px,
      rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px
    );
    pointer-events: none;
    z-index: 2;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  /* ── Header ── */
  header {
    padding: 40px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo-area {}

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  h1 span { color: var(--accent); }

  .header-right {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* ── Settings Panel ── */
  .settings-toggle {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .settings-toggle:hover { color: var(--accent); border-color: rgba(245,166,35,0.3); }

  .settings-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
    display: none;
  }

  .settings-panel.open { display: block; }

  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 600px) { .settings-grid { grid-template-columns: 1fr; } }

  .setting-group { display: flex; flex-direction: column; gap: 8px; }

  .setting-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  .setting-select, .setting-input {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 8px 10px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .setting-select:focus, .setting-input:focus {
    border-color: rgba(245,166,35,0.4);
  }

  .setting-input::placeholder { color: var(--text3); }

  .save-btn {
    margin-top: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    background: rgba(245,166,35,0.08);
    border: 1px solid rgba(245,166,35,0.2);
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.2s;
  }

  .save-btn:hover { background: rgba(245,166,35,0.15); }

  /* ── Mode Toggle ── */
  .mode-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  .mode-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 7px 16px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .mode-btn.active-expand {
    background: rgba(0,229,255,0.1);
    border-color: rgba(245,166,35,0.3);
    color: var(--expand-color);
  }

  .mode-btn.active-narrow {
    background: rgba(255,107,53,0.1);
    border-color: rgba(255,107,53,0.3);
    color: var(--narrow-color);
  }

  /* ── Input Area ── */
  .input-area {
    margin-bottom: 32px;
  }

  .input-wrap {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .main-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    padding: 14px 16px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
  }

  .main-input:focus { border-color: rgba(245,166,35,0.3); }
  .main-input::placeholder { color: var(--text3); }

  .drill-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 14px 20px;
    background: var(--accent);
    color: #0e0a07;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    letter-spacing: 0.05em;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .drill-btn:hover { opacity: 0.85; }
  .drill-btn:active { transform: scale(0.97); }
  .drill-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Breadcrumb ── */
  .breadcrumb {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin-bottom: 24px;
    min-height: 24px;
  }

  .crumb {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    padding: 3px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .crumb:hover { color: var(--accent); border-color: rgba(245,166,35,0.2); }
  .crumb.current { color: var(--text2); cursor: default; }
  .crumb-sep { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text3); }

  /* ── Cards ── */
  .cards-area { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    opacity: 0;
    transform: translateY(12px);
    animation: cardIn 0.4s forwards;
  }

  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.12s; }
  .card:nth-child(3) { animation-delay: 0.19s; }
  .card:nth-child(4) { animation-delay: 0.26s; }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--card-accent, var(--accent));
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 0.25s;
  }

  .card:hover {
    border-color: rgba(255,255,255,0.12);
    transform: translateX(4px);
    box-shadow: -4px 0 20px rgba(0,0,0,0.3);
  }

  .card:hover::before { transform: scaleY(1); }

  .card-num {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text3);
    letter-spacing: 0.2em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .card-question {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 10px;
  }

  .card-hint {
    font-size: 11px;
    color: var(--text3);
    line-height: 1.5;
  }

  .card-arrow {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--text3);
    transition: color 0.2s, transform 0.2s;
  }

  .card:hover .card-arrow {
    color: var(--card-accent, var(--accent));
    transform: translateY(-50%) translateX(3px);
  }

  /* ── Loading ── */
  .loading-area {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 48px 0;
  }

  .loading-area.show { display: flex; }

  .drill-anim {
    display: flex;
    gap: 4px;
    align-items: flex-end;
  }

  .drill-bar {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    animation: drillPulse 0.8s ease-in-out infinite;
  }

  .drill-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
  .drill-bar:nth-child(2) { height: 16px; animation-delay: 0.1s; }
  .drill-bar:nth-child(3) { height: 24px; animation-delay: 0.2s; }
  .drill-bar:nth-child(4) { height: 16px; animation-delay: 0.3s; }
  .drill-bar:nth-child(5) { height: 8px; animation-delay: 0.4s; }

  @keyframes drillPulse {
    0%, 100% { opacity: 0.3; transform: scaleY(0.6); }
    50% { opacity: 1; transform: scaleY(1); }
  }

  .loading-text {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* ── Empty / Error ── */
  .empty-state {
    text-align: center;
    padding: 64px 0;
    display: none;
  }

  .empty-state.show { display: block; }

  .empty-icon {
    font-size: 40px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .empty-text {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    line-height: 1.8;
  }

  /* ── Reset ── */
  .reset-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: color 0.2s, border-color 0.2s;
    z-index: 10;
    display: none;
  }

  .reset-btn.show { display: block; }
  .reset-btn:hover { color: var(--accent2); border-color: rgba(255,107,53,0.3); }

  /* ── API key warning ── */
  .api-warning {
    background: rgba(255,107,53,0.08);
    border: 1px solid rgba(255,107,53,0.2);
    border-radius: 6px;
    padding: 12px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    margin-bottom: 20px;
    display: none;
  }

  .api-warning.show { display: block; }

  /* ── Depth indicator ── */
  .depth-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    align-items: center;
  }

  .depth-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-right: 4px;
  }

  .depth-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s;
  }

  .depth-dot.active { background: var(--accent); }
</style>
</head>
<body>

<div class="scanlines"></div>

<div class="wrapper">

  <header>
    <div class="logo-area">
      <p class="eyebrow">// Yuta's Tools — Think</p>
      <h1>Think <span>Drill</span></h1>
    </div>
    <div class="header-right">
      <button class="settings-toggle" onclick="toggleSettings()">⚙ Settings</button>
    </div>
  </header>

  <!-- Settings -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-grid">
      <div class="setting-group">
        <label class="setting-label">AI Model</label>
        <select class="setting-select" id="modelSelect">
          <optgroup label="Claude">
            <option value="claude-sonnet">Claude Sonnet 4.6</option>
            <option value="claude-haiku">Claude Haiku 4.5</option>
          </optgroup>
          <optgroup label="Gemini">
            <option value="gemini-flash">Gemini 2.5 Flash</option>
            <option value="gemini-flash-lite">Gemini 2.5 Flash-Lite</option>
          </optgroup>
          <optgroup label="OpenAI">
            <option value="gpt-4o">GPT-4o</option>
            <option value="gpt-4o-mini">GPT-4o mini</option>
          </optgroup>
        </select>
      </div>
      <div class="setting-group">
        <label class="setting-label" id="apiKeyLabel">API Key</label>
        <input type="password" class="setting-input" id="apiKeyInput" placeholder="sk-ant-...">
      </div>
    </div>
    <button class="save-btn" onclick="saveSettings()">Save Settings</button>
  </div>

  <!-- API warning -->
  <div class="api-warning" id="apiWarning">
    ⚠ APIキーが未設定です。Settingsから設定してください。
  </div>

  <!-- Mode -->
  <div class="mode-bar">
    <button class="mode-btn active-expand" id="modeExpand" onclick="setMode('expand')">↗ 広げる</button>
    <button class="mode-btn" id="modeNarrow" onclick="setMode('narrow')">↘ 絞る</button>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <input
        type="text"
        class="main-input"
        id="mainInput"
        placeholder="今、何に行き詰まってる？"
        maxlength="200"
        onkeydown="if(event.key==='Enter') startDrill()"
      >
      <button class="drill-btn" id="drillBtn" onclick="startDrill()">DRILL ↓</button>
    </div>
  </div>

  <!-- Depth -->
  <div class="depth-bar" id="depthBar" style="display:none;">
    <span class="depth-label">Depth</span>
    <div class="depth-dot" id="d0"></div>
    <div class="depth-dot" id="d1"></div>
    <div class="depth-dot" id="d2"></div>
    <div class="depth-dot" id="d3"></div>
    <div class="depth-dot" id="d4"></div>
  </div>

  <!-- Breadcrumb -->
  <div class="breadcrumb" id="breadcrumb"></div>

  <!-- Loading -->
  <div class="loading-area" id="loadingArea">
    <div class="drill-anim">
      <div class="drill-bar"></div>
      <div class="drill-bar"></div>
      <div class="drill-bar"></div>
      <div class="drill-bar"></div>
      <div class="drill-bar"></div>
    </div>
    <p class="loading-text">Drilling deeper...</p>
  </div>

  <!-- Cards -->
  <div class="cards-area" id="cardsArea"></div>

  <!-- Empty -->
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">⬇</div>
    <p class="empty-text">行き詰まりを一行で入力して<br>DRILL を押す</p>
  </div>

</div>

<button class="reset-btn" id="resetBtn" onclick="resetDrill()">↺ Reset</button>

<script>
  // ── State ──
  let mode = 'expand';
  let history = []; // {question, cards[]}
  let currentDepth = 0;

  // ── Model config ──
  const MODEL_CONFIG = {
    'claude-sonnet': { provider: 'claude', model: 'claude-sonnet-4-6' },
    'claude-haiku':  { provider: 'claude', model: 'claude-haiku-4-5-20251001' },
    'gemini-flash':  { provider: 'gemini', model: 'gemini-2.5-flash' },
    'gemini-flash-lite': { provider: 'gemini', model: 'gemini-2.5-flash-lite' },
    'gpt-4o':        { provider: 'openai', model: 'gpt-4o' },
    'gpt-4o-mini':   { provider: 'openai', model: 'gpt-4o-mini' },
  };

  // ── Init ──
  window.onload = () => {
    loadSettings();
    checkApiKey();
    document.getElementById('emptyState').classList.add('show');
  };

  function loadSettings() {
    const model = localStorage.getItem('td_model') || 'claude-sonnet';
    document.getElementById('modelSelect').value = model;
    updateApiKeyLabel(model);

    const key = localStorage.getItem('td_key_' + model) || '';
    document.getElementById('apiKeyInput').value = key;
  }

  function saveSettings() {
    const model = document.getElementById('modelSelect').value;
    const key = document.getElementById('apiKeyInput').value.trim();
    localStorage.setItem('td_model', model);
    if (key) localStorage.setItem('td_key_' + model, key);
    document.getElementById('settingsPanel').classList.remove('open');
    checkApiKey();
  }

  function toggleSettings() {
    const panel = document.getElementById('settingsPanel');
    panel.classList.toggle('open');
    const model = document.getElementById('modelSelect').value;
    const key = localStorage.getItem('td_key_' + model) || '';
    document.getElementById('apiKeyInput').value = key;
    updateApiKeyLabel(model);
  }

  document.getElementById('modelSelect').addEventListener('change', function() {
    updateApiKeyLabel(this.value);
    const key = localStorage.getItem('td_key_' + this.value) || '';
    document.getElementById('apiKeyInput').value = key;
  });

  function updateApiKeyLabel(model) {
    const cfg = MODEL_CONFIG[model];
    const labels = { claude: 'Anthropic API Key', gemini: 'Google API Key', openai: 'OpenAI API Key' };
    document.getElementById('apiKeyLabel').textContent = labels[cfg.provider] || 'API Key';
  }

  function checkApiKey() {
    const model = localStorage.getItem('td_model') || 'claude-sonnet';
    const key = localStorage.getItem('td_key_' + model) || '';
    const warning = document.getElementById('apiWarning');
    if (!key) warning.classList.add('show');
    else warning.classList.remove('show');
  }

  function setMode(m) {
    mode = m;
    document.getElementById('modeExpand').className = 'mode-btn' + (m === 'expand' ? ' active-expand' : '');
    document.getElementById('modeNarrow').className = 'mode-btn' + (m === 'narrow' ? ' active-narrow' : '');
  }

  // ── Drill ──
  async function startDrill() {
    const input = document.getElementById('mainInput').value.trim();
    if (!input) return;

    history = [{ question: input, cards: [] }];
    currentDepth = 0;
    updateBreadcrumb();
    await generateCards(input, null);
  }

  async function drillInto(cardQuestion, cardIndex) {
    const parent = history[history.length - 1];
    history.push({ question: cardQuestion, cards: [] });
    currentDepth = history.length - 1;
    updateBreadcrumb();
    await generateCards(cardQuestion, parent.question);
  }

  async function generateCards(question, parentQuestion) {
    const model = localStorage.getItem('td_model') || 'claude-sonnet';
    const key = localStorage.getItem('td_key_' + model) || '';

    if (!key) {
      document.getElementById('apiWarning').classList.add('show');
      document.getElementById('settingsPanel').classList.add('open');
      return;
    }

    setLoading(true);
    document.getElementById('emptyState').classList.remove('show');
    document.getElementById('resetBtn').classList.add('show');
    updateDepth();

    const cfg = MODEL_CONFIG[model];
    const modeDesc = mode === 'expand'
      ? '可能性を広げる方向で、視点・前提・別の角度を問い直す問いを生成してください。'
      : '本質に絞り込む方向で、核心・根本原因・本当の目的を突く問いを生成してください。';

    const contextNote = parentQuestion
      ? `前の問いの文脈: 「${parentQuestion}」\n現在の問い: 「${question}」`
      : `最初の行き詰まり: 「${question}」`;

    const prompt = `あなたは思考の掘り下げを助けるアシスタントです。

${contextNote}

${modeDesc}

この行き詰まりや問いに対して、次に探索すべき「問いカード」を4枚生成してください。
各カードには「問い」（1〜2文）と「ヒント」（短い補足、20字以内）を含めてください。

必ずJSON配列のみで返答してください。前置きや説明は不要です。
フォーマット:
[
  {"question": "問いの文章", "hint": "短いヒント"},
  ...
]`;

    try {
      let cards = [];

      if (cfg.provider === 'claude') {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: cfg.model,
            max_tokens: 800,
            messages: [{ role: 'user', content: prompt }]
          })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        const text = data.content[0].text;
        cards = parseCards(text);

      } else if (cfg.provider === 'gemini') {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        const text = data.candidates[0].content.parts[0].text;
        cards = parseCards(text);

      } else if (cfg.provider === 'openai') {
        const res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${key}`
          },
          body: JSON.stringify({
            model: cfg.model,
            max_tokens: 800,
            messages: [{ role: 'user', content: prompt }]
          })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        const text = data.choices[0].message.content;
        cards = parseCards(text);
      }

      history[history.length - 1].cards = cards;
      renderCards(cards);

    } catch(e) {
      setLoading(false);
      renderError(e.message);
    }

    setLoading(false);
  }

  function parseCards(text) {
    try {
      const clean = text.replace(/```json|```/g, '').trim();
      const start = clean.indexOf('[');
      const end = clean.lastIndexOf(']');
      if (start === -1 || end === -1) throw new Error('no array');
      return JSON.parse(clean.slice(start, end + 1));
    } catch(e) {
      return [{ question: 'パースエラー: レスポンスを確認してください', hint: 'Error' }];
    }
  }

  function renderCards(cards) {
    const area = document.getElementById('cardsArea');
    area.innerHTML = '';
    const accentColors = ['#00e5ff', '#ff6b35', '#7c3aed', '#00ff88'];
    cards.forEach((card, i) => {
      const color = mode === 'expand' ? accentColors[i % accentColors.length] : '#ff6b35';
      const el = document.createElement('div');
      el.className = 'card';
      el.style.setProperty('--card-accent', color);
      el.innerHTML = `
        <div class="card-num">// ${String(i + 1).padStart(2, '0')}</div>
        <div class="card-question">${escHtml(card.question)}</div>
        ${card.hint ? `<div class="card-hint">${escHtml(card.hint)}</div>` : ''}
        <span class="card-arrow">→</span>
      `;
      el.onclick = () => drillInto(card.question, i);
      area.appendChild(el);
    });
  }

  function renderError(msg) {
    const area = document.getElementById('cardsArea');
    area.innerHTML = `<div style="font-family:'Space Mono',monospace;font-size:11px;color:var(--accent2);padding:16px;border:1px solid rgba(255,107,53,0.2);border-radius:6px;">Error: ${escHtml(msg)}</div>`;
  }

  function setLoading(on) {
    document.getElementById('loadingArea').className = 'loading-area' + (on ? ' show' : '');
    document.getElementById('drillBtn').disabled = on;
    if (on) document.getElementById('cardsArea').innerHTML = '';
  }

  // ── Breadcrumb ──
  function updateBreadcrumb() {
    const bc = document.getElementById('breadcrumb');
    bc.innerHTML = '';
    history.forEach((h, i) => {
      if (i > 0) {
        const sep = document.createElement('span');
        sep.className = 'crumb-sep';
        sep.textContent = '›';
        bc.appendChild(sep);
      }
      const crumb = document.createElement('span');
      crumb.className = 'crumb' + (i === history.length - 1 ? ' current' : '');
      crumb.textContent = h.question.length > 20 ? h.question.slice(0, 20) + '…' : h.question;
      crumb.title = h.question;
      if (i < history.length - 1) {
        crumb.onclick = () => jumpTo(i);
      }
      bc.appendChild(crumb);
    });
  }

  function jumpTo(index) {
    history = history.slice(0, index + 1);
    currentDepth = index;
    updateBreadcrumb();
    updateDepth();
    renderCards(history[index].cards);
  }

  function updateDepth() {
    const depth = history.length - 1;
    document.getElementById('depthBar').style.display = 'flex';
    for (let i = 0; i < 5; i++) {
      document.getElementById('d' + i).className = 'depth-dot' + (i <= depth ? ' active' : '');
    }
  }

  function resetDrill() {
    history = [];
    currentDepth = 0;
    document.getElementById('cardsArea').innerHTML = '';
    document.getElementById('breadcrumb').innerHTML = '';
    document.getElementById('depthBar').style.display = 'none';
    document.getElementById('mainInput').value = '';
    document.getElementById('resetBtn').classList.remove('show');
    document.getElementById('emptyState').classList.add('show');
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
